<!-- ==================== UI MỚI CHO PHẦN USER ACCESS TOKEN ==================== -->
<!-- Thay thế phần User Access Token cũ bằng đoạn này -->

<div class="form-group">
    <label>User Access Token ngắn hạn <span style="color: red">*</span></label>
    <div style="display: flex; gap: 10px; align-items: flex-end;">
        <input type="text" id="new-page-token" placeholder="Dán User Access Token" style="flex: 1;" autocomplete="off">
        <button type="button" class="btn btn-primary" onclick="fetchPageList()" style="white-space: nowrap;">
            Lấy danh sách Page
        </button>
    </div>
    <small>Sau khi lấy danh sách, chọn Page muốn thêm rồi nhấn "Thêm Page đã chọn".</small>
</div>

<!-- Khu vực hiển thị danh sách Page -->
<div id="page-selection-section" style="display: none; margin-top: 20px; border-top: 1px solid #2a241b; padding-top: 16px;">
    <h4 style="margin-bottom: 12px; color: #e8e0cd;">Chọn Page muốn thêm:</h4>
    
    <div id="page-list-container" 
         style="max-height: 300px; overflow-y: auto; border: 1px solid #3d3527; border-radius: 8px; padding: 8px; background: #17140f;">
    </div>

    <div style="margin-top: 15px; text-align: right;">
        <button class="btn btn-success" onclick="addSelectedPage()" id="add-selected-btn" disabled>
            ➕ Thêm Page đã chọn
        </button>
    </div>
</div>
